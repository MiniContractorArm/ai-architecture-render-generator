[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-architecture-render-generator"
version = "0.4.2"
description = "Plugin-host desktop tool that turns natural-language architecture briefs into rendered diagrams, elevations, and axonometric sheets."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "the ai-architecture-render-generator contributors" }]
keywords = ["architecture", "render", "diagram", "plugin-host", "generative"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

dependencies = [
  "pydantic>=2.7",
  "tomli>=2.0; python_version < '3.11'",
  "Pillow>=10.3",
  "numpy>=1.26",
  "watchdog>=4.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.5",
  "black>=24.4",
]
gpu = [
  "onnxruntime-gpu>=1.18",
]

[project.scripts]
aarg = "handlers.cli:app"

[project.entry-points."aarg.renderers"]
stub = "extensions.render_stub.plugin:StubRenderer"
blueprint = "extensions.render_blueprint.plugin:BlueprintRenderer"

[tool.hatch.build.targets.wheel]
packages = ["core", "contracts", "extensions", "services", "handlers", "models", "utils", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "contracts", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"